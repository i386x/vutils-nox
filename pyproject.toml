#

[build-system]
requires = ["setuptools >=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vutils-nox"
authors = [
    {name = "Jiří Kučera", email = "sanczes@gmail.com"},
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
license = "MIT"
license-files = ["LICENSE"]
description = "Shared Nox configuration for vutils"
readme = "README.md"
keywords = ["nox"]
dependencies = [
    "nox",
]
requires-python = ">=3.10, <4"
dynamic = ["version"]

[project.urls]
"Home Page" = "https://github.com/i386x/vutils-nox"
Issues = "https://github.com/i386x/vutils-nox/issues"
Source = "https://github.com/i386x/vutils-nox"

[tool.setuptools.dynamic]
version = {attr = "vutils.nox.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 79

[tool.pylint.main]
ignore-patterns = ["^\\.#", "^.*\\.pyi"]

[tool.pylint.design]
min-public-methods = 0

[tool.pylint.format]
max-line-length = 79

[tool.pylint."messages control"]
enable = ["useless-suppression"]
# `mypy` does the better job
disable = ["no-member"]

[tool.pylint.similarities]
ignore-imports = true
