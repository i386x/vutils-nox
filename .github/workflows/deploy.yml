---

name: Deploy vutils-nox

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build the package
        uses: $/.github/actions/build

      - name: Deploy the package
        uses: pypa/gh-action-pypi-publish@release/v1

    permissions:
      id-token: write
